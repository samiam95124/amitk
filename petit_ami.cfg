#
# Configuration file for Petit-ami and submodules
#
# Format:
#
# Each key is of the form:
#
# <name> string
#
# Where the name and string are separated by a single space, and the string is
# terminated by end of line.
#
# Comments, which are lines of the form:
#
# #<any characters>...
#
# Can appear anywhere, as well as can blank lines.
#
# Configuration lines can be grouped in blocks:
#
# begin
#
#     value 123
#     next  A string
#
# end
#
# These can nest to any level. Typically each module in Petit-ami has its own
# block, and those are further subdivided by plug-ins and operating system
# specific values.
#

#
# Definitions for services module
#
begin services
end

#
# Definitions for terminal mode
#
# Terminal mode applies to several modules, including console and graph.
#
begin terminal

    #
    # Set default dimensions of main window.
    #
    # Note the standard default for this is 80x25, which was the common size of
    # CRT terminals before windowed systems.
    #
    # Note for xterm or similar console windows, you can't set the size of the
    # window, so it actually sets the size of the screen buffer. The buffer is
    # normally set to the window size.
    #
    #maxxd 80
    #maxyd 25

    #
    # Enable/disable mouse
    #
    mouse 1

    #
    # Enable/disable joystick
    #
    joystick 1
    
    #
    # Dump Petit-Ami events
    #
    dump_event 0

end

#
# Definitions for the character mode window manager (windowc)
#
begin windowc

    #
    # Scroll bars: a child window whose buffer is larger than its client area
    # shows a bar on the right and/or along the bottom, to scroll the view
    # over the buffer. 1 on, 0 off.
    #
    scrollbuffer 1

end

#
# definitions for console module
#
begin console
end

#
# Definitions for graphical mode
#
# Graphical mode can apply to multiple modules, but usually is reserved for just
# one main module.
#
begin graphics

    #
    # Set console font size (points). Uncomment to override the default of
    # 11 points, sized at the display DPI.
    #
    # console_points 11

    #
    # Send runtime errors to dialog/parent console window
    #
    dialogerr 1

    #
    # Scroll bars: a buffered window whose buffer is larger than its client
    # area shows the window's scroll bars, to scroll the view over the
    # buffer. 1 on, 0 off.
    #
    scrollbuffer 1

    #
    # definitions for windows version of graph
    #
    begin windows

        #
        # Definitions for windows diagnostic settings
        #
        begin diagnostics

            #
            # Dump messages (windows messages posted to us)
            #
            dump_messages 0

        end

    end
    
    #
    # definitions for XWindow version of graph
    #
    begin xwindow

        #
        # Definitions for xwindow diagnostic settings
        #
        begin diagnostics

            #
            # Dump messages (xwindow messages posted to us)
            #
            dump_messages 0

            #
            # Print font metrics on loading
            #
            print_font_metrics 0

        end

    end

    #
    # definitions for macOS version of graph
    #
    begin macosx

        #
        # Definitions for macOS diagnostic settings
        #
        begin diagnostics

            #
            # Dump messages (diagnostic)
            #
            dump_messages 0

            #
            # Print font metrics on loading
            #
            print_font_metrics 0

        end

    end

end

#
# Definitions for widgets
#
begin widgets

    #
    # Theme values.
    #
    # Each entry overrides one point of the widget theme table. A color is
    # written as three decimal components "red green blue" (0 to 255), or as
    # a hex triplet "rrggbb" with an optional leading '#'. Theme points that
    # are not colors take a plain number.
    #
    # Entries not listed keep their built in values, and an entry whose name
    # is not a known theme point is ignored, so a config file written for a
    # later version still loads here.
    #
    # The full set of names is the th_* list in portable/gnome_widgets.c with
    # the "th_" prefix dropped. The common ones are shown below.
    #
    begin theme

        # button background: normal, hovered, pressed
        #back             252 252 252
        #backhover        230 230 230
        #backpressed      211 211 211

        # button outline, focused outline, face text enabled and disabled
        #outline1         149 149 149
        #focus            53 132 228
        #text             0 0 0
        #textdis          146 149 149

        # checkbox/radio button select figure and outline
        #chkrad           53 132 228
        #chkradout        205 199 194

        # scrollbar background, bar, pressed bar
        #scrollback       250 249 248
        #scrollbar        126 126 126
        #scrollbarpressed 86 86 86

        # querycolor dialog palette, querycolor1 through querycolor36
        #querycolor1      0 0 0

    end

end

#
# definitions for sound module
#
begin sound
end

#
# definitions for network module
#
begin network
end
